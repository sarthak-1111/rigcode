name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: The command you ran and the prompt you gave.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `rigcode doctor`
      description: It shows your rigcode, Python and OS versions and the model server. Remove anything private.
      render: text
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and server
      placeholder: e.g. qwen3-coder:30b on Ollama 0.34, or gpt-oss-120b on llama.cpp b6xxx
