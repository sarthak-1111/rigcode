[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "rigcode"
version = "0.1.1"
description = "A terminal coding agent for models you run yourself: llama.cpp, Ollama, LM Studio, vLLM. Built to stay fast on slow hardware."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sarthak" }]
requires-python = ">=3.10"
keywords = ["coding-agent", "llm", "local-llm", "llama.cpp", "ollama", "self-hosted", "cli", "agent", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "prompt_toolkit>=3.0.43",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/sarthak-1111/rigcode"
Issues = "https://github.com/sarthak-1111/rigcode/issues"
Changelog = "https://github.com/sarthak-1111/rigcode/blob/main/CHANGELOG.md"

[project.scripts]
rigcode = "rigcode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["rigcode"]

[tool.hatch.build.targets.sdist]
include = ["rigcode", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741", "B905"]   # B905: zipped lists are equal-length by construction (gather results)
